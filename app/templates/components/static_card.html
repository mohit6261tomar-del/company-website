<div class="static-card card h-100 shadow-sm border-0 hover-lift">
  <div class="card-body p-4">
    <div class="d-flex align-items-center mb-3">
      <div class="icon-container bg-{{ color }}-subtle text-{{ color }} rounded-circle p-3 me-3">
        <i class="{{ icon }} fa-2x"></i>
      </div>
      <h5 class="card-title mb-0 text-dark">{{ title }}</h5>
    </div>
    <p class="card-text text-dark">{{ description }}</p>
  </div>
</div>
