<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4361ee;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4cc9f0;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- Background Elements -->
  <rect width="600" height="400" fill="url(#heroGradient)" rx="20"/>

  <!-- Floating Elements -->
  <circle cx="100" cy="100" r="30" fill="#ffffff" opacity="0.1"/>
  <circle cx="500" cy="80" r="25" fill="#ffffff" opacity="0.1"/>
  <circle cx="150" cy="300" r="20" fill="#ffffff" opacity="0.1"/>
  <circle cx="450" cy="320" r="35" fill="#ffffff" opacity="0.1"/>

  <!-- Main Illustration - Modern Device Stack -->
  <g transform="translate(200, 50)">
    <!-- Laptop -->
    <rect x="50" y="100" width="200" height="130" rx="10" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <rect x="60" y="110" width="180" height="110" rx="5" fill="#f8f9fa"/>

    <!-- Laptop Screen Content -->
    <rect x="70" y="120" width="160" height="90" rx="3" fill="#4361ee" opacity="0.1"/>
    <circle cx="150" cy="165" r="20" fill="#ffffff" opacity="0.3"/>

    <!-- Mobile Phone -->
    <rect x="280" y="80" width="80" height="140" rx="15" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <rect x="285" y="90" width="70" height="120" rx="10" fill="#f8f9fa"/>

    <!-- Phone Screen -->
    <rect x="290" y="100" width="60" height="100" rx="8" fill="#4cc9f0" opacity="0.1"/>
    <rect x="295" y="110" width="50" height="8" rx="4" fill="#ffffff" opacity="0.3"/>
    <rect x="295" y="125" width="50" height="8" rx="4" fill="#ffffff" opacity="0.3"/>
    <rect x="295" y="140" width="35" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

    <!-- Tablet -->
    <rect x="20" y="150" width="150" height="100" rx="12" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <rect x="30" y="160" width="130" height="80" rx="8" fill="#f8f9fa"/>

    <!-- Connecting Lines -->
    <line x1="250" y1="165" x2="280" y2="140" stroke="#4361ee" stroke-width="3" opacity="0.3"/>
    <line x1="130" y1="200" x2="170" y2="180" stroke="#4cc9f0" stroke-width="3" opacity="0.3"/>

    <!-- Decorative Elements -->
    <circle cx="300" cy="50" r="15" fill="#ff6b6b" opacity="0.2"/>
    <circle cx="80" cy="280" r="12" fill="#4cc9f0" opacity="0.3"/>
    <circle cx="220" cy="260" r="8" fill="#4361ee" opacity="0.4"/>
  </g>

  <!-- Tech Icons -->
  <g transform="translate(50, 300)">
    <circle cx="0" cy="0" r="20" fill="#4361ee" opacity="0.1"/>
    <text x="0" y="5" font-family="Arial" font-size="16" text-anchor="middle" fill="#4361ee">💻</text>
  </g>

  <g transform="translate(500, 320)">
    <circle cx="0" cy="0" r="20" fill="#4cc9f0" opacity="0.1"/>
    <text x="0" y="5" font-family="Arial" font-size="16" text-anchor="middle" fill="#4cc9f0">📱</text>
  </g>

  <g transform="translate(300, 350)">
    <circle cx="0" cy="0" r="20" fill="#ff6b6b" opacity="0.1"/>
    <text x="0" y="5" font-family="Arial" font-size="16" text-anchor="middle" fill="#ff6b6b">🚀</text>
  </g>
</svg>
