<svg width="500" height="400" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="featureGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4361ee;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#4cc9f0;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" fill="url(#featureGradient)" rx="15"/>

  <!-- Main Content -->
  <g transform="translate(50, 50)">
    <!-- Team Section -->
    <g transform="translate(0, 0)">
      <!-- Team Circle -->
      <circle cx="150" cy="100" r="80" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
      <circle cx="150" cy="100" r="70" fill="#f8f9fa"/>

      <!-- Team Members -->
      <circle cx="130" cy="80" r="15" fill="#4361ee"/>
      <text x="130" y="85" font-family="Arial" font-size="10" text-anchor="middle" fill="white">👨‍💻</text>

      <circle cx="170" cy="80" r="15" fill="#4cc9f0"/>
      <text x="170" y="85" font-family="Arial" font-size="10" text-anchor="middle" fill="white">👩‍🎨</text>

      <circle cx="150" cy="120" r="15" fill="#ff6b6b"/>
      <text x="150" y="125" font-family="Arial" font-size="10" text-anchor="middle" fill="white">👨‍🚀</text>

      <!-- Team Title -->
      <text x="150" y="200" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Expert Team</text>
    </g>

    <!-- Innovation Section -->
    <g transform="translate(250, 50)">
      <!-- Lightbulb -->
      <circle cx="50" cy="50" r="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
      <circle cx="50" cy="50" r="30" fill="#fff9c4"/>

      <!-- Lightbulb Icon -->
      <path d="M40 50 L50 40 L60 50 L50 60 Z" fill="#ffc107"/>
      <rect x="48" y="60" width="4" height="10" fill="#ffc107"/>

      <!-- Innovation Title -->
      <text x="50" y="110" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Innovation</text>
    </g>

    <!-- Support Section -->
    <g transform="translate(50, 200)">
      <!-- Support Circle -->
      <circle cx="100" cy="50" r="35" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
      <circle cx="100" cy="50" r="25" fill="#e8f5e8"/>

      <!-- Support Icon -->
      <circle cx="100" cy="45" r="8" fill="#4caf50"/>
      <text x="100" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="white">?</text>

      <!-- Support Title -->
      <text x="100" y="100" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">24/7 Support</text>
    </g>

    <!-- Connecting Lines -->
    <line x1="150" y1="180" x2="50" y2="180" stroke="#4361ee" stroke-width="2" opacity="0.3"/>
    <line x1="200" y1="100" x2="250" y2="90" stroke="#4cc9f0" stroke-width="2" opacity="0.3"/>
    <line x1="150" y1="20" x2="50" y2="20" stroke="#ff6b6b" stroke-width="2" opacity="0.3"/>

    <!-- Decorative Elements -->
    <circle cx="350" cy="150" r="20" fill="#4361ee" opacity="0.1"/>
    <circle cx="400" cy="250" r="15" fill="#4cc9f0" opacity="0.1"/>
    <circle cx="20" cy="300" r="25" fill="#ff6b6b" opacity="0.1"/>

    <!-- Small Icons -->
    <g transform="translate(300, 200)">
      <circle cx="0" cy="0" r="15" fill="#e3f2fd"/>
      <text x="0" y="5" font-family="Arial" font-size="12" text-anchor="middle" fill="#1976d2">⚡</text>
    </g>

    <g transform="translate(350, 100)">
      <circle cx="0" cy="0" r="15" fill="#fce4ec"/>
      <text x="0" y="5" font-family="Arial" font-size="12" text-anchor="middle" fill="#e91e63">🎯</text>
    </g>
  </g>
</svg>
